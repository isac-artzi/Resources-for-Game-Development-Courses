name: Publish lecture notes

# Assembles the site with .github/build-site.py (each course's "Lecture Notes"
# folder becomes <course-slug>/ plus a generated landing page) and publishes it
# to GitHub Pages. Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - '**/Lecture Notes/**'
      - '.github/build-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: python3 .github/build-site.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
